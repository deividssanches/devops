apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localstack
  namespace: infra
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: aws.sanches.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: localstack # Nome do seu serviço
                port:
                  number: 4566 #

    - host: localstack.sanches.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: localstack # Nome do seu serviço
                port:
                  number: 4566 #

