apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports: [{ containerPort: 4566 }]
          env:
            - name: SERVICES
              value: s3
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: localstack-secret
                  key: LOCALSTACK_AUTH_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: infra
spec:
  type: LoadBalancer
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
