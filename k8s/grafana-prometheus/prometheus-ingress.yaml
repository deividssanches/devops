apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: monitoring # Altere para o seu namespace se não for 'monitoring'
spec:
  # Isso força o Traefik do Rancher Desktop a assumir o controle desta rota
  ingressClassName: traefik
  rules:
    - host: prometheus.sanches.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Confirme se este é o nome exato visto no seu 'kubectl get svc'
                #name: prometheus-stack-kube-prometheus-prometheus
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
